  <text x="61" y="266" fill="#93abc9" font-family="DejaVu Sans,Arial,sans-serif" font-size="16">Tela USB integrada ao desktop.</text>
  <text x="61" y="293" fill="#93abc9" font-family="DejaVu Sans,Arial,sans-serif" font-size="16">Caneta, pressão e calibração de quatro pontos.</text>
