  <circle cx="1110" cy="40" r="190" fill="#38bdf8" opacity=".045"/>
  <circle cx="810" cy="390" r="200" fill="#a78bfa" opacity=".04"/>
  <rect x="60" y="57" width="150" height="28" rx="14" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".4"/>
