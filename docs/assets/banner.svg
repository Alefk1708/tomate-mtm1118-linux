  <text x="58" y="151" fill="#f0f6ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="51" font-weight="bold" letter-spacing="-1.5">Tomate MTM-1118</text>
  <text x="61" y="198" fill="#adc4e3" font-family="DejaVu Sans,Arial,sans-serif" font-size="23">Sua mesa. Seu Linux. Seu traço.</text>
