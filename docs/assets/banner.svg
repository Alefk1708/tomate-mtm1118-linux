<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tomate MTM-1118 para Linux</title>
  <desc id="desc">Mesa digitalizadora e caneta: tela USB, pressão e calibração no desktop Linux.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1222"/><stop offset="1" stop-color="#17243c"/></linearGradient>
    <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#153744"/><stop offset=".52" stop-color="#263764"/><stop offset="1" stop-color="#383163"/></linearGradient>
    <linearGradient id="ink" x2="1" y2=".3"><stop stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="pen" x2="1" y2="1"><stop stop-color="#ccd7e6"/><stop offset=".48" stop-color="#7b8aa4"/><stop offset="1" stop-color="#394960"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#90a9cb" stroke-opacity=".07"/></pattern>
  </defs>
